# Apply with:  kubectl apply -k deploy/otlp
#
# Requires the base stack (namespace + KB datalake PVC) already applied via
# `kubectl apply -k deploy/k3s`. Layered the same way deploy/kafka and
# deploy/flink are: an additive, on-demand overlay, not folded into the base
# kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 10-pipeline-otlp.yaml
