# Minimal stand-in for kube-verdict's alert webhook, for proving
# KubeVerdictAlertSink (kb/alert.py) against a real socket and a real JSON
# round-trip -- not kube-verdict's own RCA logic, which lives in that repo.
# kb/alert.py's own unit tests already mock urlopen; this is the one thing
# those can't prove: a real POST over the network actually lands.
#
# Optional, on-demand (like deploy/flink and deploy/kafka): apply with
#   kubectl apply -k deploy/mock-kubeverdict
# then see tools/live_check_alert.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-kubeverdict-server
  namespace: patchtst
data:
  server.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    received = []

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            pass  # quiet: the /received endpoint is the record of truth

        def _json(self, status, payload):
            data = json.dumps(payload).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/health":
                self._json(200, {"status": "ok"})
            elif self.path == "/received":
                self._json(200, {"alerts": received})
            else:
                self._json(404, {"error": "not found"})

        def do_POST(self):
            if self.path != "/api/v1/webhook/signal":
                self._json(404, {"error": "not found"})
                return
            length = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(length))
            alerts = body.get("alerts", [])
            received.extend(alerts)
            self._json(202, {"received": len(alerts)})

    port = int(os.environ.get("PORT", "8080"))
    server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
    print(f"mock kube-verdict webhook listening on :{port}")
    server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-kubeverdict
  namespace: patchtst
  labels:
    app: mock-kubeverdict
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-kubeverdict
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mock-kubeverdict
    spec:
      containers:
        - name: server
          image: python:3.11-slim
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: server-code
              mountPath: /app
      volumes:
        - name: server-code
          configMap:
            name: mock-kubeverdict-server
---
apiVersion: v1
kind: Service
metadata:
  name: mock-kubeverdict
  namespace: patchtst
  labels:
    app: mock-kubeverdict
spec:
  selector:
    app: mock-kubeverdict
  ports:
    - name: http
      port: 8080
      targetPort: http
