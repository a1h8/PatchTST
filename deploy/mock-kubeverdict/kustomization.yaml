# Apply with:  kubectl apply -k deploy/mock-kubeverdict
#
# Requires the base stack (namespace) already applied via `kubectl apply -k
# deploy/k3s`. Layered the same way deploy/flink and deploy/kafka are: an
# additive, on-demand overlay, not folded into the base kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patchtst
resources:
  - 00-server.yaml
