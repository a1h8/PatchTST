name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install torch (CPU wheel)
        # CPU index keeps the wheel small/fast; satisfies torch>=2.0 for the
        # detection/inference deps installed next.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          # pipeline runtime (connectors + kb + pyyaml), then the torch/
          # transformers detectors, then httpx (fastapi TestClient in test_kb).
          pip install -r requirements-pipeline.txt
          pip install -r requirements-detection-patchtst.txt
          pip install httpx

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest + coverage gate)
        # Coverage threshold (--cov-fail-under=75) is enforced from pytest.ini.
        run: pytest -q
